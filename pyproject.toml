[project]
name = "portproxy"
version = "0.1.0"
description = "PortProxy - Windows TCP 端口转发可视化管理工具"
requires-python = ">=3.11"
authors = [{ name = "ai-lhg" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# 禁用缓存写入；tmp_path 由 tests/conftest.py 自定义接管
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
